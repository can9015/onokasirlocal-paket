<VirtualHost *:80>

    ServerName onokasir.local
    ServerAlias www.onokasir.local

    DocumentRoot "D:/OnokasirLocal/public_html"

    <Directory "D:/OnokasirLocal/public_html">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    DirectoryIndex index.php index.html

    ErrorLog "D:/OnokasirLocal/logs/onokasir-local-error.log"
    CustomLog "D:/OnokasirLocal/logs/onokasir-local-access.log" combined

</VirtualHost>